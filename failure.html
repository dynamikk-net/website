<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Dynamikk — Failure</title>
    <link rel="stylesheet" href="dynamikk.css">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
</head>
<body class="font-sans text-dynamikk-navy bg-white flex flex-col min-h-screen">

    <header class="w-full bg-white/95 backdrop-blur-sm border-b border-gray-100 py-5 sticky top-0 z-50">
        <div class="max-w-[1800px] mx-auto px-6 lg:px-12 flex justify-between items-center">
            <a href="index.html" class="inline-block group">
                <div class="font-logo font-light text-2xl tracking-logo uppercase text-black">
                    Dynamikk Limited
                </div>
            </a>
            <a href="mailto:contact@dynamikk.net" class="text-sm text-dynamikk-blue hover:underline transition-all duration-300">
                contact@dynamikk.net
            </a>
        </div>
    </header>

   <main class="flex-grow flex items-center justify-center relative z-10 px-6 py-12 bg-white">
        <div class="max-w-xl w-full bg-white border border-gray-200 p-8 sm:p-12 rounded-sm shadow-sm text-center animate-content">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-red-50 border border-red-100 text-red-600 mb-6">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-8 h-8">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z" />
                </svg>
            </div>

            <h1 class="text-3xl sm:text-4xl font-bold tracking-tight text-gray-900 mb-4">
                Something went wrong
            </h1>

            <p class="text-gray-600 font-light leading-relaxed mb-8">
                Please email us at <a href="mailto:contact@dynamikk.net" class="text-dynamikk-blue transition-colors hover:underline">contact@dynamikk.net</a>.
            </p>

            <div>
                <a href="index.html" class="inline-flex items-center justify-center px-6 py-3 bg-slate-900 text-white font-semibold rounded-sm border border-transparent hover:bg-transparent hover:border-slate-900 hover:text-slate-900 transition-all duration-300 text-sm shadow-sm cursor-pointer">
                    Close
                </a>
            </div>

        </div>
    </main>

    <footer class="bg-white border-t border-gray-200 mt-auto">
        <div class="max-w-[1800px] mx-auto px-6 lg:px-12 pt-6 pb-6 grid grid-cols-1 md:grid-cols-3 items-center md:items-start gap-6">

            <div class="flex flex-col items-center md:items-start text-center md:text-left max-w-xs justify-self-center md:justify-self-start">
                <div class="text-xs text-gray-400">
                    <p class="mb-1">&copy; 2026 Dynamikk Limited</p>
                </div>
            </div>

            <div class="text-center">
                <a href="privacy_policy.html" class="text-xs text-dynamikk-blue transition-colors font-medium hover:underline">
                    Privacy policy
                </a>
            </div>

            <div class="text-center md:text-right">
                <a href="mailto:contact@dynamikk.net" class="text-xs text-dynamikk-blue transition-colors hover:underline">
                    contact@dynamikk.net
                </a>
            </div>
        </div>
    </footer>
</body>
</html>
